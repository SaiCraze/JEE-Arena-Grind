<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080C16" />
    <meta name="background-color" content="#080C16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Grind Arena" />
    <meta name="application-name" content="JEE Grind Arena" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Gamified JEE preparation sanctuary and competitive study arena for Sai, Utham, and Ved." />
    <meta property="og:title" content="JEE Grind Arena - Tactile Arcade Study Command Deck" />
    <meta property="og:description" content="Real-time competitive JEE study tracker, orbital focus chronometer, co-op raid bosses, and normalized percentile analytics." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>JEE Grind Arena - Tactile Arcade Study Command Deck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      window.__deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredPwaPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-available'));
      });
      window.addEventListener('appinstalled', function () {
        window.__deferredPwaPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .catch(function (err) {
              console.warn('Service Worker registration failed:', err);
            });
        });
      }
    </script>
  </head>
  <body class="bg-[#080C16] text-[#F8FAFC] antialiased selection:bg-[#2563EB]/40 selection:text-[#38BDF8]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
